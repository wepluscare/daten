<text x="343.8" y="234.8" font-size="15" font-weight="700" fill="#4A463E" text-anchor="start">gemeinnützige und öffentliche Spitex</text>
<text x="490.0" y="440.1" font-size="15" font-weight="700" fill="#0E6B78" text-anchor="start">erwerbswirtschaftliche Spitex</text>
<text x="110.0" y="546.6" font-size="13" font-weight="600" fill="#16A8B5" text-anchor="start">Balken: gemeldete angestellte Angehörige (BAG-Umfrage), nur 2022–2024</text>
<line x1="886" y1="148" x2="886" y2="394" stroke="#B0432A" stroke-width="3"/>
<text x="898" y="164" font-size="14" font-weight="700" fill="#1B1A17">Normkosten je Stunde Grundpflege</text>
<text x="898" y="184" font-size="12.5" font-weight="400" fill="#4A463E">Kanton Zürich 2026, Kreisschreiben</text>
<text x="898" y="218" font-size="13" font-weight="400" fill="#1B1A17">Pflegehelfer/in SRK,</text>
<text x="898" y="236" font-size="13" font-weight="400" fill="#1B1A17">bei beauftragter Spitex angestellt</text>
<text x="898" y="264" font-size="24" font-weight="700" fill="#1B1A17">Fr. 146.62</text>
<text x="898" y="282" font-size="12" font-weight="400" fill="#4A463E">Krankenkasse 52.60 + Kanton 94.00</text>
<text x="898" y="316" font-size="13" font-weight="400" fill="#1B1A17">dieselbe Ausbildung,</text>
<text x="898" y="334" font-size="13" font-weight="400" fill="#1B1A17">als angestellte Angehörige</text>
<text x="898" y="362" font-size="24" font-weight="700" fill="#B0432A">Fr. 68.36</text>
<text x="898" y="380" font-size="12" font-weight="400" fill="#4A463E">Krankenkasse 52.60 + Kanton 15.75</text>
<text x="898" y="418" font-size="12" font-weight="400" fill="#4A463E">Die Vorlage der Gesundheitsdirektion würde</text>
<text x="898" y="435" font-size="12" font-weight="400" fill="#4A463E">davon nur Fr. 32 als Lohn anrechnen.</text>
<text x="898" y="468" font-size="12" font-weight="400" fill="#4A463E">Erwerbswirtschaftliche Spitex 2024:</text>
<text x="898" y="485" font-size="12" font-weight="400" fill="#4A463E">22’864 von 68’707 Beschäftigten (33 %),</text>
<text x="898" y="502" font-size="12" font-weight="400" fill="#4A463E">aber 50 % der Pflegehelfer/innen SRK.</text>
<text x="110" y="132" font-size="13.5" fill="#4A463E" text-anchor="start">2024 beschäftigt die erwerbswirtschaftliche Spitex erstmals gleich viele Pflegehelfer/innen SRK wie der ganze gemeinnützige Sektor.</text>
