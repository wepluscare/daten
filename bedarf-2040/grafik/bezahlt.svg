<text x="60" y="653" font-size="13" fill="#8A8578">75 Organisationen (Bundesrat 15.10.2025), Untergrenze. Normkosten: Kreisschreiben Normdefizite 2026 der Gesundheitsdirektion Zürich, Beilage 2.</text>
