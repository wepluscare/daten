<text x="100" y="132" font-size="13.5" fill="#4A463E" text-anchor="start">Bezahlt ist ein Strich: rund 1 Mio Stunden Grundpflege durch angestellte Angehörige (BAG-Umfrage 2024) gegenüber 126 Mio Stunden unbezahlter Pflege (SAKE 2024).</text>
