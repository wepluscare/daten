<text x="60" y="635" font-size="13" fill="#8A8578">Quellen: Obsan 09/2025 T 10.1. Angehörigen-Hilfe: Untergrenze BFS SGB 2022 (Anteile nach Alter/Geschlecht) × BFS-Szenario 2025, eigene Rechnung; Obergrenze Obsan 03/2026</text>
<text x="60" y="653" font-size="13" fill="#8A8578">(EFG), gleich fortgeschrieben; Überschneidung mit Spitex 59 % (BFS-Medienmitteilung 12.11.2024, SGB 2022). Bezahlt: Bundesrat 15.10.2025, BAG-Umfrage (614 VZÄ).</text>
