<text x="389.2" y="521.7" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">17 %</text>
<path d="M299.4,530.4 A175,175 0 0 1 380.0,200.0 L380.0,270.0 A105,105 0 0 0 331.7,468.2 Z" fill="#C9B27A" stroke="#FFFFFF" stroke-width="3"/>
<text x="244.0" y="348.8" font-size="20" font-weight="700" fill="#1B1A17" text-anchor="middle">42 %</text>
<text x="380" y="369.0" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="52" fill="#1B1A17" text-anchor="middle">218</text>
<text x="380" y="399.0" font-size="15" fill="#4A463E" text-anchor="middle">Mio Stunden 2024</text>
<rect x="620" y="174" width="18" height="18" rx="3" fill="#0E6B78"/>
<text x="650" y="190" font-size="19" font-weight="700" fill="#1B1A17">Pflege von Erwachsenen im eigenen Haushalt</text>
<text x="650" y="216" font-size="16" fill="#4A463E">88 Mio Stunden · rund 46’000 Vollzeitstellen</text>
<text x="650" y="238" font-size="14" fill="#8A8578">z. B. Partnerin, Partner oder Eltern im gleichen Haushalt · 8,5 h/Woche je Haushalt</text>
<rect x="620" y="266" width="18" height="18" rx="3" fill="#16A8B5"/>
<text x="650" y="282" font-size="19" font-weight="700" fill="#1B1A17">Pflege von Erwachsenen in anderen Haushalten</text>
<text x="650" y="308" font-size="16" fill="#4A463E">38 Mio Stunden · rund 20’000 Vollzeitstellen</text>
<text x="650" y="330" font-size="14" fill="#8A8578">Verwandte 33 Mio h, Bekannte 4 Mio h · 2,7 h/Woche je pflegende Person</text>
<rect x="620" y="358" width="18" height="18" rx="3" fill="#C9B27A"/>
<text x="650" y="374" font-size="19" font-weight="700" fill="#1B1A17">Andere Hilfe für Verwandte in anderen Haushalten</text>
<text x="650" y="400" font-size="16" fill="#4A463E">92 Mio Stunden · rund 49’000 Vollzeitstellen</text>
<text x="650" y="422" font-size="14" fill="#8A8578">Haushalt, Einkäufe, Fahrten, Administration · nicht nur für Pflegebedürftige</text>
</svg>