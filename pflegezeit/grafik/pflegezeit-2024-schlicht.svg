<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
<rect width="1200" height="675" fill="#FFFFFF"/>
<text x="60" y="62" font-size="27" font-weight="600" fill="#1B1A17">Unbezahlte Pflege und Hilfe für Erwachsene, 2024</text>
<text x="60" y="98" font-size="18" fill="#4A463E">Zeitvolumen der Bevölkerung ab 15, Schweiz 2024, in Millionen Stunden · Anteil in Prozent</text>
<line x1="60" y1="613" x2="1140" y2="613" stroke="#E4E4E4" stroke-width="1.5"/>
<text x="60" y="635" font-size="13" fill="#8A8578">Quelle: BFS, SAKE-Modul Unbezahlte Arbeit 2024, Tabelle T 03.06.03.01 «Zeitvolumen für unbezahlte Arbeit» (Asset 34768200). «Andere Hilfe» = Haushalt, Transport,</text>
<text x="60" y="653" font-size="13" fill="#8A8578">Administratives für Verwandte ausserhalb des Haushalts, nicht nur für Pflegebedürftige. Vollzeitstellen: 1’900 h, eigene Umrechnung. Serienbruch 2021. Darstellung We+.</text>
