<text x="380" y="395.0" font-size="14" fill="#4A463E" text-anchor="middle">Menschen ab 65</text>
<text x="380" y="413.0" font-size="14" fill="#4A463E" text-anchor="middle">mit Pflege oder Hilfe</text>
<rect x="620" y="171" width="18" height="18" rx="3" fill="#B0432A"/>
<text x="650" y="186" font-size="18" font-weight="700" fill="#1B1A17">Pflegeheim, Langzeit</text>
<text x="650" y="208" font-size="15" fill="#4A463E">86’000 · Obsan 2023</text>
<rect x="620" y="237" width="18" height="18" rx="3" fill="#7A5A12"/>
<text x="650" y="252" font-size="18" font-weight="700" fill="#1B1A17">Kurzzeitaufenthalt</text>
<text x="650" y="274" font-size="15" fill="#4A463E">2’000 · Obsan 2023</text>
<rect x="620" y="303" width="18" height="18" rx="3" fill="#0E6B78"/>
<text x="650" y="318" font-size="18" font-weight="700" fill="#1B1A17">Nur Spitex-Pflege</text>
<text x="650" y="340" font-size="15" fill="#4A463E">96’000 · 41 % der Spitex-Klientinnen und -Klienten (Obsan 2023)</text>
<rect x="620" y="369" width="18" height="18" rx="3" fill="#16A8B5"/>
<text x="650" y="384" font-size="18" font-weight="700" fill="#1B1A17">Spitex-Pflege und Angehörige</text>
<text x="650" y="406" font-size="15" fill="#4A463E">139’000 · 59 % der Spitex-Klientinnen und -Klienten (BFS, SGB 2022)</text>
<rect x="620" y="435" width="18" height="18" rx="3" fill="#9ED9DF"/>
<text x="650" y="450" font-size="18" font-weight="700" fill="#1B1A17">Nur Angehörige</text>
<text x="650" y="472" font-size="15" fill="#4A463E">196’000 · Untergrenze; mit Obergrenze (EFG) bis 320’000</text>
<text x="620" y="520" font-size="15" font-weight="700" fill="#0E6B78">Angehörige beteiligt: 334’000 von 519’000 (64 %)</text>
<text x="620" y="542" font-size="14" fill="#4A463E">davon bei einer Spitex angestellt: 3’023 (BAG-Umfrage 2024) bis 11’469 (BFS-Näherung 2024)</text>
<text x="90" y="132" font-size="13.5" fill="#4A463E" text-anchor="start">Alle Altersgruppen: Spitex 5,3 % der Bevölkerung (476’000 Personen, Spitex-Statistik 2024) · Hilfe von Angehörigen 13 % (BFS, SGB 2022).</text>
