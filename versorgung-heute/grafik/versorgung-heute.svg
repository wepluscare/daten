<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
<rect width="1200" height="675" fill="#FBF8F4"/>
<rect x="0" y="0" width="1200" height="8" fill="#16A8B5"/>
<text x="60" y="66" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="40" fill="#1B1A17">Wer versorgt Menschen ab 65: bei zwei Dritteln die Angehörigen</text>
<text x="60" y="100" font-size="19" fill="#4A463E">Schweiz, Personen ohne Doppelzählung · Pflege 2023 (Obsan), Angehörigen-Hilfe 2024 (SGB-Anteile × Bevölkerung)</text>
<line x1="60" y1="613" x2="1140" y2="613" stroke="#E7E1D3" stroke-width="1.5"/>
<text x="60" y="635" font-size="13" fill="#8A8578">Quellen: Obsan 09/2025 T 10.1 (2023). Angehörigen-Hilfe: BFS SGB 2022 (Hilfe aus gesundheitlichen Gründen, nach Alter/Geschlecht) × Bevölkerung 2024, eigene Rechnung,</text>
<text x="60" y="653" font-size="13" fill="#8A8578">Untergrenze; Obergrenze Obsan 03/2026 (EFG). Überschneidung Spitex/Angehörige 59 % (BFS-Medienmitteilung 12.11.2024, SGB 2022). Bezahlt: Bundesrat 15.10.2025, BAG-Umfrage.</text>
<path d="M380.0,200.0 A175,175 0 0 1 530.6,285.9 L470.4,321.6 A105,105 0 0 0 380.0,270.0 Z" fill="#B0432A" stroke="#FBF8F4" stroke-width="3"/>
